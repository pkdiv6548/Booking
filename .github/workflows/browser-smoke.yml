name: Browser smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependency
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static website server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tripnest-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tripnest-server.log
          exit 1
      - name: Run page-load and responsive checks
        run: npm run test:smoke
