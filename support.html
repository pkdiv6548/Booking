<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact support | TripNest</title><link rel="stylesheet" href="assets/styles.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="plane" aria-hidden="true">➤</span> TRIPNEST</a><nav class="navlinks"><a href="stays.html">Stays</a><a href="trips.html">My trips</a><a href="help.html">Help centre</a></nav><div class="navright"><a class="btn secondary" href="login.html">Sign in</a></div></div></header><main class="container section" style="max-width:760px"><h1>Contact support</h1><p class="section-intro">Tell us what you need help with using this demo form.</p><div class="notice"><strong>Prototype notice</strong><p>This form is for testing the frontend only. It does not send your message to a support team.</p></div><form class="card card-body" style="margin-top:22px" data-demo-submit data-success="Support form submitted in demo mode. No message was sent externally."><div class="field"><label for="topic">Topic</label><select id="topic" name="topic"><option>Booking question</option><option>Change or cancellation</option><option>Account help</option><option>Website feedback</option><option>Other</option></select></div><div class="field"><label for="name">Your name</label><input id="name" name="name" autocomplete="name" required></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="5" required></textarea></div><button class="primary" type="submit">Submit demo request</button></form><p style="margin-top:20px"><a href="help.html">Browse frequently asked questions</a></p></main><script src="assets/app.js"></script></body></html>
