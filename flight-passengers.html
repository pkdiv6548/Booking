<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Traveller details | TripNest Flights</title><link rel="stylesheet" href="assets/styles.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="plane">➤</span> TRIPNEST</a><nav class="navlinks"><a href="flights.html">Flights</a><a href="trips.html">My trips</a><a href="help.html">Help</a></nav></div></header><main class="container section"><div class="steps"><span class="step active">1 Flight</span><span class="step active">2 Traveller details</span><span class="step">3 Payment</span><span class="step">4 Ticket</span></div><form class="form-card" data-flight-passenger-form><h1>Traveller details</h1><p class="muted">Enter the primary traveller details exactly as they appear on the travel document.</p><div class="form-grid"><div class="field"><label for="title">Title *</label><select id="title" name="title" required><option value="Mr">Mr</option><option value="Ms">Ms</option><option value="Mrs">Mrs</option><option value="Mx">Mx</option></select></div><div class="field"><label for="nationality">Nationality *</label><select id="nationality" name="nationality" required><option value="India">India</option><option value="Other">Other</option></select></div><div class="field"><label for="first-name">First name *</label><input id="first-name" name="firstName" autocomplete="given-name" required></div><div class="field"><label for="last-name">Last name *</label><input id="last-name" name="lastName" autocomplete="family-name" required></div><div class="field"><label for="dob">Date of birth *</label><input id="dob" name="dob" type="date" required></div><div class="field"><label for="gender">Gender *</label><select id="gender" name="gender" required><option value="">Choose</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label for="traveller-email">Email address *</label><input id="traveller-email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="traveller-phone">Mobile number *</label><input id="traveller-phone" name="phone" type="tel" autocomplete="tel" required></div></div><div class="notice">Demo only: traveller details are saved in this browser session and are not sent to an airline.</div><button class="primary" type="submit">Continue to payment →</button></form></main><script src="assets/app.js"></script></body></html>
